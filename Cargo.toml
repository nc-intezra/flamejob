[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nc-intezra/flamejob"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
jsonwebtoken = "9"
argon2 = "0.5"
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
nvml-wrapper = "0.10"
sysinfo = "0.32"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
sha2 = "0.10"
tokio-stream = { version = "0.1", features = ["sync"] }
