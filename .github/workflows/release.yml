name: Release

# Builds Debian packages and attaches them to the GitHub Release for a tag.
# Runs automatically when a v* tag is pushed, and can be run on demand against
# an existing tag (e.g. v1.0.0) via the Actions "Run workflow" button.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build .debs for and attach (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  debs:
    name: build & attach .deb packages
    # Ubuntu 24.04 (glibc 2.39): packages install on 24.04 through 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package .deb (server, agent, cli, tui)
        run: |
          cargo deb --no-build -p flamejob-server
          cargo deb --no-build -p flamejob-agent
          cargo deb --no-build -p flamejob-cli
          cargo deb --no-build -p flamejob-tui
          ls -lh target/debian/*.deb

      - name: Attach .deb packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Create the release if it does not exist yet (auto-generated notes),
          # otherwise leave its notes untouched; then (re)attach the packages.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" target/debian/*.deb --clobber --repo "$GITHUB_REPOSITORY"
