name: Release

# Builds Debian packages and attaches them to the GitHub Release for a tag.
# Runs automatically when a v* tag is pushed, and can be run on demand against
# an existing tag (e.g. v1.0.0) via the Actions "Run workflow" button.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build .debs for and attach (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  debs:
    name: build & attach .deb packages
    # Ubuntu 22.04 (glibc 2.35): binaries link against the older glibc, so the
    # packages install and run on 22.04 and every newer release (glibc is
    # forward-compatible); cargo-deb stamps libc6 (>= 2.35) accordingly.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package .deb (server, agent, cli, tui)
        run: |
          cargo deb --no-build -p flamejob-server
          cargo deb --no-build -p flamejob-agent
          cargo deb --no-build -p flamejob-cli
          cargo deb --no-build -p flamejob-tui
          ls -lh target/debian/*.deb

      - name: Attach .deb packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Create the release if it does not exist yet (auto-generated notes),
          # otherwise leave its notes untouched; then (re)attach the packages.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" target/debian/*.deb --clobber --repo "$GITHUB_REPOSITORY"

  windows-msi:
    name: build & attach Windows MSI (agent)
    runs-on: windows-latest
    # Run after the .deb job so the GitHub Release already exists (avoids both
    # jobs racing to create it); this job then just uploads the MSI to it.
    needs: debs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Build the agent (release)
        run: cargo build --release -p flamejob-agent

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Build the MSI
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v',''
          $out = "flamejob-agent-$version-x64.msi"
          wix build .\deploy\windows\flamejob-agent.wxs `
            -d "Version=$version" `
            -d "AgentExe=$PWD\target\release\fj-agent.exe" `
            -o $out
          "MSI=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach the MSI to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" --repo "$env:GITHUB_REPOSITORY" --title "$tag" --generate-notes
          }
          gh release upload "$tag" "$env:MSI" --clobber --repo "$env:GITHUB_REPOSITORY"
