[package]
name = "flamejob-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "flamejob distributed worker agent (fj-agent): runs hashcat chunk tasks for a flamejob control plane"

[[bin]]
name = "fj-agent"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "nc-intezra <nc-intezra@users.noreply.github.com>"
section = "net"
priority = "optional"
assets = [
    ["target/release/fj-agent", "usr/bin/", "755"],
]

[dependencies]
flamejob-core = { path = "../flamejob-core" }
flamejob-api = { path = "../flamejob-api" }
flamejob-runner = { path = "../flamejob-runner" }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
hex = "0.4"
rcgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sysinfo = { workspace = true }
