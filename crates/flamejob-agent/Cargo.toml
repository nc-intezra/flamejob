[package]
name = "flamejob-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "flamejob distributed worker agent (fj-agent): runs hashcat chunk tasks for a flamejob control plane"

[[bin]]
name = "fj-agent"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "nc-intezra <nc-intezra@users.noreply.github.com>"
section = "net"
priority = "optional"
# Built on Ubuntu 22.04 (glibc 2.35); libc6 and friends are auto-computed ($auto).
# The agent generates its keypair with pure-Rust crypto, so no openssl is needed.
depends = "$auto"
# postinst creates the flamejob-agent user, the data dir (owned by it), and a
# default env file, and enables the service; prerm/postrm stop/disable it and
# purge the env file on `apt purge`.
maintainer-scripts = "debian/"
assets = [
    ["target/release/fj-agent", "usr/bin/", "755"],
    ["../../deploy/flamejob-agent.service", "lib/systemd/system/flamejob-agent.service", "644"],
]

[dependencies]
flamejob-core = { path = "../flamejob-core" }
flamejob-api = { path = "../flamejob-api" }
flamejob-runner = { path = "../flamejob-runner" }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
hex = "0.4"
rcgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sysinfo = { workspace = true }

# Windows: run as a native Service Control Manager service, and log to a file
# under %ProgramData% (there is no console/journald under the SCM). These are
# compiled only on Windows and pulled in by the `#[cfg(windows)] mod service`.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
tracing-appender = "0.2"
