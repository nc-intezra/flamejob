[package]
name = "flamejob-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "flamejob terminal dashboard"

[[bin]]
name = "flamejob-tui"
path = "src/main.rs"

[[bin]]
name = "tui-shot"
path = "src/bin/shot.rs"

[package.metadata.deb]
maintainer = "nc-intezra <nc-intezra@users.noreply.github.com>"
section = "net"
priority = "optional"
# Ship only the dashboard binary, not the screenshot dev tool (tui-shot).
assets = [
    ["target/release/flamejob-tui", "usr/bin/", "755"],
]

[dependencies]
flamejob-core = { path = "../flamejob-core" }
flamejob-api = { path = "../flamejob-api" }
flamejob-client = { path = "../flamejob-client" }
ratatui = "0.29"
crossterm = "0.28"
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
