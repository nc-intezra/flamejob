[package]
name = "flamejob-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "flamejob control-plane server (flamejobd): distributed hashcat job queue — API, scheduler, chunking, telemetry, agent fleet"

[[bin]]
name = "flamejobd"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "nc-intezra <nc-intezra@users.noreply.github.com>"
section = "net"
priority = "optional"
# Built on Ubuntu 22.04 (glibc 2.35); libc6 and friends are auto-computed from
# the binary ($auto). openssl is used by the postinst to generate keys.
depends = "$auto, openssl"
# postinst creates the flamejob user, keys, a default config, and enables the
# service; prerm/postrm stop/disable it and purge config on `apt purge`.
maintainer-scripts = "debian/"
assets = [
    ["target/release/flamejobd", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/flamejob-server/README.md", "644"],
    ["../../deploy/flamejob-server.service", "lib/systemd/system/flamejob-server.service", "644"],
]

[dependencies]
flamejob-core = { path = "../flamejob-core" }
flamejob-api = { path = "../flamejob-api" }
flamejob-db = { path = "../flamejob-db" }
flamejob-runner = { path = "../flamejob-runner" }
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
utoipa = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
rand = "0.8"
figment = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
nvml-wrapper = { workspace = true }
sysinfo = { workspace = true }
tokio-stream = { workspace = true }
anyhow = { workspace = true }
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
rcgen = { workspace = true }
pem = "3"
futures-util = { workspace = true }
async-trait = { workspace = true }
